site_name: Java Architect Interview Guide
site_description: Architecture-focused interview questions for senior Java engineers

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - search.highlight
    - search.suggest
    - toc.integrate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Core Java & JVM: core-java.md
  - Spring Boot: spring-boot.md
  - Architecture & Design: architecture.md
  - Scenario - Real System: scenario.md
  - Microservices: microservices.md
  - Kafka & Messaging: kafka.md
  - Database: database.md
  - Kubernetes & Cloud: kubernetes.md
  - Security: security.md
  - Observability: observability.md
  - Must-Ask Questions: must-ask.md
  - Scoring Rubric: scoring.md
